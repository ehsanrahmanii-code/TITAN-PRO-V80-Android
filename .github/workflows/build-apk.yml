name: Build TITAN PRO V80 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble engine ZIP from base64 parts
        run: |
          chmod +x scripts/assemble_engine.sh
          if ls engine_b64/p*.b64 >/dev/null 2>&1; then
            ./scripts/assemble_engine.sh
          else
            mkdir -p app/src/main/assets
            echo "ENGINE_PARTS_MISSING" > app/src/main/assets/README_ENGINE.txt
            echo "Warning: engine_b64 parts not in repo yet"
          fi
          ls -lah app/src/main/assets/ || true

      - name: Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew

      - name: Assemble Release APK (all ABIs)
        run: ./gradlew assembleRelease --no-daemon

      - name: Show APK size
        run: find app/build/outputs -type f -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PRO-V80-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
