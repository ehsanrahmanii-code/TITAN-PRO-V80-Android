name: Build TITAN PRO V80 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Titan engine ZIP in assets
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/TITAN_PRO_V80_FINAL.zip ]; then
            echo "Place TITAN_PRO_V80_FINAL.zip under app/src/main/assets before build."
            echo "MISSING_ENGINE" > app/src/main/assets/README_ENGINE.txt
          fi
          ls -lh app/src/main/assets/ || true

      - name: Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: List outputs
        run: find app/build/outputs -type f -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PRO-V80-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
