name: Build TITAN PRO Full Embedded APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Write SDK license files
        run: |
          for sdkroot in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" /usr/local/lib/android/sdk; do
            [ -n "$sdkroot" ] && [ -d "$sdkroot" ] || continue
            mkdir -p "$sdkroot/licenses"
            printf '%s\n' "24333f8a63b6825ea9c5514f6abdf25bea91e6fe" > "$sdkroot/licenses/android-sdk-license"
            printf '%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" > "$sdkroot/licenses/android-sdk-preview-license"
            printf '%s\n' "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$sdkroot/licenses/android-sdk-arm-dbt-license"
          done

      - name: Extract FULL engine into app/src/main/python/titan
        run: |
          set -e
          mkdir -p /tmp/engine_zip app/src/main/python
          echo "Downloading TITAN PRO V80 engine zip..."
          curl -fsSL -o /tmp/engine_zip/TITAN_PRO_V80_FINAL.zip \
            "https://litter.catbox.moe/koytyz.zip"
          test $(wc -c < /tmp/engine_zip/TITAN_PRO_V80_FINAL.zip) -gt 500000
          unzip -q /tmp/engine_zip/TITAN_PRO_V80_FINAL.zip -d /tmp/engine_zip/out
          # zip contains titan_pro/titan/{runtime.py,layers/...}
          SRC=$(find /tmp/engine_zip/out -type f -name runtime.py | head -1)
          test -n "$SRC"
          SRC_DIR=$(dirname "$SRC")
          echo "Engine source: $SRC_DIR"
          rm -rf app/src/main/python/titan
          mkdir -p app/src/main/python/titan
          cp -a "$SRC_DIR"/. app/src/main/python/titan/
          # verify critical files
          test -f app/src/main/python/titan/runtime.py
          test -f app/src/main/python/titan/layers/core/bootstrap_storage.py
          test -f app/src/main/python/titan_bootstrap.py
          N=$(find app/src/main/python/titan -name '*.py' | wc -l)
          echo "Packaged py files: $N"
          test "$N" -ge 50
          ls -la app/src/main/python/titan/layers/core/ | head -15
          echo "Engine embedded OK"

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore titan-release.keystore \
            -alias titan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass titanpro80 -keypass titanpro80 \
            -dname "CN=TITAN PRO, OU=Mobile, O=Titan, L=Tehran, ST=Tehran, C=IR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed Release APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show APK
        run: |
          find app/build/outputs -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PRO-FULL-V80-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
