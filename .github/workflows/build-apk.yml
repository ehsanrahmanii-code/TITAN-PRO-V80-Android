name: Build TITAN PRO Full Embedded APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Write SDK license files
        run: |
          for sdkroot in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" /usr/local/lib/android/sdk; do
            [ -n "$sdkroot" ] && [ -d "$sdkroot" ] || continue
            mkdir -p "$sdkroot/licenses"
            printf '%s\n' "24333f8a63b6825ea9c5514f6abdf25bea91e6fe" > "$sdkroot/licenses/android-sdk-license"
            printf '%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" > "$sdkroot/licenses/android-sdk-preview-license"
            printf '%s\n' "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$sdkroot/licenses/android-sdk-arm-dbt-license"
          done

      - name: Install FULL TITAN V80 engine (V75-style)
        run: |
          set -e
          mkdir -p app/src/main/python
          # 1) Try assemble from base64 zip parts
          if [ -f scripts/assemble_full_engine.py ]; then
            python3 scripts/assemble_full_engine.py || echo "assemble skipped (incomplete parts)"
          fi
          # 2) If titan_pro has real layers, prefer them
          if [ -d titan_pro/titan/layers ] && [ "$(find titan_pro/titan -name '*.py' | wc -l)" -gt 5 ]; then
            echo "Copying titan_pro engine into Chaquopy path..."
            rm -rf app/src/main/python/titan
            cp -a titan_pro/titan app/src/main/python/
            [ -f titan_pro/run_titan.py ] && cp -f titan_pro/run_titan.py app/src/main/python/
          fi
          echo "=== Python files in APK path ==="
          find app/src/main/python -name '*.py' | wc -l
          ls -la app/src/main/python/
          ls -la app/src/main/python/titan/ 2>/dev/null || true
          test -f app/src/main/python/titan_bootstrap.py
          test -f app/src/main/python/titan/runtime.py

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore titan-release.keystore \
            -alias titan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass titanpro80 -keypass titanpro80 \
            -dname "CN=TITAN PRO, OU=Mobile, O=Titan, L=Tehran, ST=Tehran, C=IR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed Release APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show APK
        run: find app/build/outputs -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PRO-FULL-V80-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
