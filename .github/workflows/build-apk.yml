name: Build TITAN PRO V80 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: tools platform-tools platforms;android-34 build-tools;34.0.0

      - name: Accept SDK licenses (non-interactive fallback)
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses" "$ANDROID_HOME/licenses" 2>/dev/null || true
          for sdkroot in "$ANDROID_SDK_ROOT" "$ANDROID_HOME"; do
            [ -n "$sdkroot" ] || continue
            mkdir -p "$sdkroot/licenses"
            echo -e "24333f8a63b6825ea9c5514f6abdf25bea91e6fe\n" > "$sdkroot/licenses/android-sdk-license"
            echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$sdkroot/licenses/android-sdk-preview-license"
            echo -e "d56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$sdkroot/licenses/android-sdk-arm-dbt-license"
            echo -e "33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$sdkroot/licenses/google-gdk-license"
            echo -e "e9acab5b5fbb560a72cfaecce8946896db3848a\n" > "$sdkroot/licenses/mips-android-sysimage-license" || true
          done
          yes 2>/dev/null | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare assets
        run: |
          mkdir -p app/src/main/assets
          if [ -d titan_pro ]; then
            (cd titan_pro && zip -qr ../app/src/main/assets/TITAN_PRO_V80_FINAL.zip .)
            ls -lh app/src/main/assets/TITAN_PRO_V80_FINAL.zip || true
          else
            echo "TITAN PRO V80" > app/src/main/assets/README_ENGINE.txt
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: List APK files
        run: find app/build/outputs -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PRO-V80-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
