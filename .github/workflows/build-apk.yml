name: Build TITAN PRO V80 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Verify checked-in TITAN engine
        run: |
          set -euxo pipefail
          test -f app/src/main/python/titan_bootstrap.py
          test -f app/src/main/python/titan/runtime.py
          test -f app/src/main/python/titan/layers/core/bootstrap_storage.py
          test -f app/src/main/python/titan/layers/web/flask_app.py
          test -f app/src/main/python/titan/layers/entry/main_entry.py
          N=$(find app/src/main/python/titan -name '*.py' | wc -l)
          echo "Checked-in Python files: $N"
          test "$N" -ge 20
          python -m py_compile $(find app/src/main/python -name '*.py' -print)

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore titan-release.keystore \
            -alias titan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass titanpro80 -keypass titanpro80 \
            -dname "CN=TAI TITAN PRO, OU=Mobile, O=Titan, L=Tehran, ST=Tehran, C=IR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed Release APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          set -euxo pipefail
          find app/build/outputs/apk -type f -name '*.apk' -exec ls -lh {} \;
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" TAI-TITAN-PRO-V80.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAI-TITAN-PRO-V80-APK
          path: TAI-TITAN-PRO-V80.apk
          if-no-files-found: error
