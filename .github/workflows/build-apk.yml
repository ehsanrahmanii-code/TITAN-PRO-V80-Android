name: Build TITAN PRO V80 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Write SDK license files
        run: |
          for sdkroot in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" /usr/local/lib/android/sdk; do
            [ -n "$sdkroot" ] && [ -d "$sdkroot" ] || continue
            mkdir -p "$sdkroot/licenses"
            printf '%s\n' "24333f8a63b6825ea9c5514f6abdf25bea91e6fe" > "$sdkroot/licenses/android-sdk-license"
            printf '%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" > "$sdkroot/licenses/android-sdk-preview-license"
            printf '%s\n' "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$sdkroot/licenses/android-sdk-arm-dbt-license"
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build complete offline asset pack (engine + 30MB+ bundle)
        run: |
          set -e
          mkdir -p app/src/main/assets/engine app/src/main/assets/ui app/src/main/assets/data

          # 1) Engine ZIP from titan_pro source in repo
          if [ -d titan_pro ]; then
            (cd titan_pro && zip -qr ../app/src/main/assets/TITAN_PRO_V80_FINAL.zip .)
          fi

          # 2) Copy any loose engine files into assets/engine
          if [ -d titan_pro ]; then
            cp -a titan_pro/. app/src/main/assets/engine/ || true
          fi

          # 3) Offline UI shell (rich dashboard landing)
          cat > app/src/main/assets/ui/index.html << 'HTML'
