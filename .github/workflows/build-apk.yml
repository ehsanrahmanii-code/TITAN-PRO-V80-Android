name: Build TITAN PRO V80 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build engine ZIP into app assets
        run: |
          mkdir -p app/src/main/assets
          if ls engine_b64/p*.b64 >/dev/null 2>&1; then
            chmod +x scripts/assemble_engine.sh || true
            ./scripts/assemble_engine.sh || true
          fi
          if [ -d titan_pro ] && [ ! -f app/src/main/assets/TITAN_PRO_V80_FINAL.zip ]; then
            (cd titan_pro && zip -r ../app/src/main/assets/TITAN_PRO_V80_FINAL.zip .)
          fi
          if [ ! -f app/src/main/assets/TITAN_PRO_V80_FINAL.zip ]; then
            echo "TITAN PRO V80 engine will be completed in repo assets" > app/src/main/assets/README_ENGINE.txt
          fi
          ls -lah app/src/main/assets/

      - name: Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew

      - name: Assemble Release APK (all ABIs)
        run: ./gradlew assembleRelease --no-daemon

      - name: Show APK size
        run: find app/build/outputs -type f -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PRO-V80-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
