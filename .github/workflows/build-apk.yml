name: Build TITAN PRO Full Embedded APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Write SDK license files
        run: |
          for sdkroot in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" /usr/local/lib/android/sdk; do
            [ -n "$sdkroot" ] && [ -d "$sdkroot" ] || continue
            mkdir -p "$sdkroot/licenses"
            printf '%s\n' "24333f8a63b6825ea9c5514f6abdf25bea91e6fe" > "$sdkroot/licenses/android-sdk-license"
            printf '%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" > "$sdkroot/licenses/android-sdk-preview-license"
            printf '%s\n' "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$sdkroot/licenses/android-sdk-arm-dbt-license"
          done

      - name: Download FULL engine zip into assets (runtime extract)
        run: |
          set -e
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/python
          echo "Downloading full TITAN PRO V80 engine zip..."
          curl -fsSL -o app/src/main/assets/TITAN_PRO_V80_FINAL.zip \
            "https://litter.catbox.moe/koytyz.zip"
          # also keep a copy next to python for fallback
          cp -f app/src/main/assets/TITAN_PRO_V80_FINAL.zip app/src/main/python/TITAN_PRO_V80_FINAL.zip
          wc -c app/src/main/assets/TITAN_PRO_V80_FINAL.zip
          test $(wc -c < app/src/main/assets/TITAN_PRO_V80_FINAL.zip) -gt 500000
          # verify zip integrity
          unzip -t app/src/main/assets/TITAN_PRO_V80_FINAL.zip | tail -3
          unzip -l app/src/main/assets/TITAN_PRO_V80_FINAL.zip | grep bootstrap_storage
          test -f app/src/main/python/titan_bootstrap.py
          echo "Engine zip OK in assets"

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore titan-release.keystore \
            -alias titan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass titanpro80 -keypass titanpro80 \
            -dname "CN=TITAN PRO, OU=Mobile, O=Titan, L=Tehran, ST=Tehran, C=IR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed Release APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show APK
        run: |
          find app/build/outputs -type f -name "*.apk" -exec ls -lh {} \;
          # confirm assets zip is inside APK
          APK=$(find app/build/outputs -name "*.apk" | head -1)
          unzip -l "$APK" | grep -i TITAN_PRO || echo "WARNING: zip not listed in APK (may be compressed path)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PRO-FULL-V80-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
