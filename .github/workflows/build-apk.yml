name: Build TITAN PRO V80 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (manual, accept licenses)
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: 'true'

      - name: Accept remaining SDK licenses
        run: |
          set +e
          yes | sdkmanager --licenses >/tmp/licenses.log 2>&1
          echo "license exit: $?"
          tail -5 /tmp/licenses.log || true
          set -e

      - name: Prepare assets
        run: |
          mkdir -p app/src/main/assets
          if [ -d titan_pro ]; then
            (cd titan_pro && zip -qr ../app/src/main/assets/TITAN_PRO_V80_FINAL.zip .)
            ls -lh app/src/main/assets/TITAN_PRO_V80_FINAL.zip
          else
            echo "TITAN PRO V80 - install engine via Termux" > app/src/main/assets/README_ENGINE.txt
          fi

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: |
          find app/build/outputs -type f -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PRO-V80-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
